summary: Update a contact by ID
tags:
  - Contacts
parameters:
  - name: contactId
    in: path
    required: true
    schema:
      type: string

requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: ../../../components/contact.yaml

responses:
  '200':
    description: Contact updated successfully
    content:
      application/json:
        schema:
          $ref: ../../../components/contact.yaml
  '404':
    description: Contact not found
