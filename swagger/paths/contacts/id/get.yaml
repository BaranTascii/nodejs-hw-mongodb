get:
  tags:
    - Contacts
  summary: Get contact by ID
  operationId: getContactById
  description: Returns a contact by its ID.
  security:
    - bearerAuth: []
  parameters:
    - name: contactId
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      description: successful response
      content:
        application/json:
          schema:
            $ref: '../../components/contact.yaml#/Contact'
    '404':
      description: Contact not found
      content:
        application/json:
          schema:
            $ref: '../../components/error.yaml#/ErrorResponse'
